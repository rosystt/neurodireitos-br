    window.PageData = {
        htmlDoc: "\u003Ch1\u003EEMOTIV Privacy Policy\u003C/h1\u003E\u000A\u003Cp\u003EEffective Date: August 6, 2026\u003C/p\u003E\u000A\u003Cp\u003EWe know your privacy is important to you and we take care to protect that privacy. Please review this Privacy Policy carefully. This Privacy Policy also applies to the Terms of Use and End User License Agreement (EULA) that covers your use of any of our products and services (collectively, \u003Cstrong\u003E“Services”\u003C/strong\u003E).\u003C/p\u003E\u000A\u003Ch2\u003EWho we are\u003C/h2\u003E\u000A\u003Cp\u003EThis is the Privacy Policy of EMOTIV. EMOTIV includes EMOTIV, Inc., and its affiliates, Emotiv Research Pty Ltd (Australia), Emotiv Limited (UK), Emotiv Vietnam (Vietnam), and  Emotiv Technology Vietnam (Vietnam).\u003C/p\u003E\u000A\u003Cp\u003EIf you have any questions or comments about our privacy practices or wish to submit a privacy request, please contact us here: \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E or contact our Data Protection Officer as set forth below.\u003C/p\u003E\u000A\u003Ch2\u003EWhy does EMOTIV care about privacy?\u003C/h2\u003E\u000A\u003Cp\u003EEMOTIV follows three guiding principles when it comes to your privacy:\u003C/p\u003E\u000A\u003Cp\u003E(i) \u003Cstrong\u003ETransparency\u003C/strong\u003E. We work to communicate to you what information we collect, when we collect, and how we will process or analyze your information.\u003Cbr /\u003E\u000A (ii) \u003Cstrong\u003ESimplicity\u003C/strong\u003E. We try to use easy\u002Dto\u002Dunderstand language to help you make informed choices.\u003C/p\u003E\u000A\u003Cp\u003E(iii) \u003Cstrong\u003EControl\u003C/strong\u003E. We give you control over the information you provide to us, and how it is used, shared, and retained.\u003C/p\u003E\u000A\u003Ch2\u003ESome helpful definitions\u003C/h2\u003E\u000A\u003Cp\u003ETo help you understand the terms we use in this document, here are some definitions we use:\u003C/p\u003E\u000A\u003Cp\u003E(i) \u003Cstrong\u003EPrivacy Policy\u003C/strong\u003E. This document explains how we collect, store, share and use your Data, and what statutory options you have for controlling that Data.\u003Cbr /\u003E\u000A (ii) \u003Cstrong\u003ETerms of Use and EULA\u003C/strong\u003E. The legal agreements between you (as the end user or Organization), and us. We seek and record your consent to these terms when you sign up to our Services. The Terms of Use and EULA include your consent that you have read and agree to our Privacy Policy.\u003Cbr /\u003E\u000A (iii) \u003Cstrong\u003EServices\u003C/strong\u003E. This is the collective term for the product and services we provide to you including our hardware, our software, our cloud storage and applications, and our websites.\u003Cbr /\u003E\u000A (iv) \u003Cstrong\u003EData\u003C/strong\u003E. This is information we collect from you that may include Personal Information, Sensitive Personal Information, Neural Data, and Consumer Health Data.  \u003Cbr /\u003E\u000A(v) \u003Cstrong\u003EPersonal Information\u003C/strong\u003E includes any information you provide that does or could identify, relate to, describe, or be reasonably associated with you as an individual person.\u003Cbr /\u003E\u000A(vi) \u003Cstrong\u003ESensitive Personal Information \u0026amp\u003B Neural Data\u003C/strong\u003E includes electrical biosignals, central or peripheral nervous system telemetry, raw EEG data, precise geolocation, biometric identifiers, genetic data, and government identifiers. Under applicable state laws (including California, Colorado, and Connecticut), Neural Data and EEG Data constitute Sensitive Personal Information.\u003Cbr /\u003E\u000A(vii)\u003Cstrong\u003EConsumer Health Data\u003C/strong\u003E (CHD) includes non\u002DHIPAA health and wellness information, cognitive performance metrics, facial expression telemetry, and emotional or mental state inferences derived from natural persons. \u003Cbr /\u003E\u000A (viii) \u003Cstrong\u003EHIPAA Disclaimer\u003C/strong\u003E EMOTIV’s direct\u002Dto\u002Dconsumer and enterprise hardware and software are provided for informational, cognitive wellness, and research purposes and do not constitute medical devices. EMOTIV is not a \u0022covered entity\u0022 or \u0022business associate\u0022 under the Health Insurance Portability and Accountability Act (HIPAA), and information collected through the Services is not Protected Health Information (PHI) under federal law, unless explicitly agreed upon in a separate, executed Business Associate Agreement (BAA) for specific clinical research contracts.\u003Cbr /\u003E\u000A\u003Cstrong\u003Eix) Demographic Data\u003C/strong\u003E means general information relevant to brain science such as your age, gender, country of residence and birth, handedness, education, number of languages spoken and musical ability. Demographic Data is Personal Information. We use it in pseudonymized or aggregated form wherever it is technically sufficient for the purpose.\u003C/p\u003E\u000A\u003Ch2\u003ESummary\u003C/h2\u003E\u000A\u003Cp\u003EThis Privacy Policy explains:\u003C/p\u003E\u000A\u003Cp\u003E(i) What kinds of information we collect\u003B\u003Cbr /\u003E\u000A (ii)   When we collect information about you\u003B\u003Cbr /\u003E\u000A (iii)  How we use Personal Information, Sensitive Personal Information, and Neural Data we collect about you\u003B\u003Cbr /\u003E\u000A (iv) The lawful basis for processing your Personal Information\u003B\u003Cbr /\u003E\u000A (v)    What steps we take to protect your Personal Information\u003B\u003Cbr /\u003E\u000A (vi)   How and with whom we share information\u003B\u003Cbr /\u003E\u000A (vii)  Data retention and data minimization\u003B\u003Cbr /\u003E\u000A (viii) Third\u002Dparty services\u003B\u003Cbr /\u003E\u000A (ix)   How you can correct information, delete, or limit information we collect about you\u003B\u003Cbr /\u003E\u000A (x)        Social media features\u003B\u003Cbr /\u003E\u000A (xi)   Closing your account\u003B\u003Cbr /\u003E\u000A (xii)  California \u0026amp\u003B Multi\u002Dstate privacy rights and universal opt\u002Dout signals (GPC)\u003B\u003Cbr /\u003E\u000A (xiii)     Changes to this Privacy Policy\u003B\u003Cbr /\u003E\u000A (xiv)  Prevention of Children and Minors under 18 using the Services\u003B\u003C/p\u003E\u000A\u003Cp\u003E(xv)   Enforcement and acceptance of this Privacy Policy\u003B and\u003Cbr /\u003E\u000A(xvi)   EU AI Act disclosures and biometric transparency\u003C/p\u003E\u000A\u003Ch2\u003EWhat kinds of information we collect\u003C/h2\u003E\u000A\u003Cp\u003EEMOTIV collects Personal Information about you (i) when you provide it directly to us, (ii) when third parties such as our business partners and service providers provide us with Personal Information about you, or (iii) when Personal Information about you is automatically collected in connection with your use of the Services.\u003C/p\u003E\u000A\u003Cp\u003E(i) We collect personal information we directly ask you for:\u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EContact Information\u003C/strong\u003E. This is information we collect to identify or contact you, such as your first and last name, physical address, email address, or telephone number. For example, this is the basic information that we collect when you register for the Services.\u2028  \u003C/li\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EFinancial Account Information\u003C/strong\u003E. This is information that you provide to purchase Services, including credit card number, credit card expiration date, credit card verification code, bank account number, bank account title, bank name, branch location, and routing number. You must only provide us with financial account information for accounts and credit cards that you have the lawful right to access.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Cp\u003E(ii) We collect Personal Information that third parties give to us:\u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EPartner Information\u003C/strong\u003E. This is information that our business partners, such as our content\u002Dproviding partners, share with us. For example, if you use their services to purchase, preview, and/or otherwise use their content when using the Services.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Cp\u003E(iii) We collect Personal Information from you automatically when you use our Services:\u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EUser Account Information\u003C/strong\u003E. This is information that identifies you to the Services, such as your user name, email address, password, and IP address. For example, we use this information to authenticate you when you log in to the Services, and use the IP address to help maintain your web session security while using the Services.   \u003C/li\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EUser Content\u003C/strong\u003E. You may choose to input Personal Information as part of content, images, comments, information, and materials that you post to or through the Services.  \u003C/li\u003E\u000A\u003Cli\u003E\u003Cstrong\u003ELog Data\u003C/strong\u003E. This is information recorded about how you use the Services, such as IP addresses, cookies, device and browser type, geographic location, web beacons, operating system, the pages, features, products or services you browsed, the time spent viewing those pages, features, products or services, the products or services you added to your cart or purchased, the frequency with which you used the Services, search terms you used, the links on the Services that your clicked on or used, and other statistics. EMOTIV recognizes automated opt\u002Dout preference signals, including Global Privacy Control (GPC) and Universal Opt\u002DOut Mechanisms (UOOMs), as valid opt\u002Dout requests under applicable state laws.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Cp\u003EEMOTIV also collects information from you that constitutes Sensitive Personal Information, Neural Data, or Consumer Health Data: \u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EEEG Data and Neural Data\u003C/strong\u003E. Consists of electrical biosignals, sensor telemetry, and motion sensor outputs collected when you use EMOTIV devices.  Under applicable state laws (including California, Colorado and Connecticut), EEG Data and biosignals constitute \u0022Neural Data\u0022 and \u0022Sensitive Personal Information\u0022.  For the purposes of this Privacy Policy, we also use the term “EEG Data” to include information derived directly from EEG biosignals, motion and other hardware signals such as mental commands, performance metrics and facial expressions.  \u003C/li\u003E\u000A\u003Cli\u003E\u003Cstrong\u003EExperiment Data \u0026amp\u003B Cognitive Telemetry\u003C/strong\u003E. Information collected during voluntary participation in research,  experiments, studies or programs, or your use of the Services, such as performance metrics, cognitive load, focus/fatigue trendlines, your EEG Data, Demographic Data, performance data, responses to experiment questions, and any data collected from related monitoring equipment, associated data such as event timing markers, mouse, touchscreen, gestural, and keyboard events, eye movements, survey responses, choices and preferences, tactile, audio, visual, and other sensory stimuli, reaction times, self\u002Dassessment, and cognitive performance, and responses to experiment questions.  \u003Cbr /\u003E\u000A\u003Cstrong\u003EConsumer Health Data:\u003C/strong\u003E Non\u002DHIPAA health, wellness, cognitive metrics, or derived health inferences. We process Consumer Health Data directly in accordance with the \u003Cstrong\u003EConsumer Health Data Disclosures\u003C/strong\u003E section set forth below in this Privacy Policy.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Ch2\u003EWhen do we collect information about you?\u003C/h2\u003E\u000A\u003Cp\u003EWe collect Personal Information and Sensitive Personal Information when you:\u003C/p\u003E\u000A\u003Cp\u003E(i) create an account with EMOTIV (a \u003Cstrong\u003E“User Account”\u003C/strong\u003E)\u003B\u003Cbr /\u003E\u000A (ii) log into the Services\u003B\u003Cbr /\u003E\u000A (iii) interact with the Services (such as by submitting EEG Data or Neural Data)\u003B\u003Cbr /\u003E\u000A (iv) upload or generate User Content, such as by third\u002Dparty social media platforms\u003B\u003Cbr /\u003E\u000A (v) communicate with us or respond to a communication or interaction from us\u003B and\u003C/p\u003E\u000A\u003Cp\u003E(vi) decide to participate in research and other experiments, studies or programs (collectively, \u003Cstrong\u003E“Experiments”\u003C/strong\u003E).\u003C/p\u003E\u000A\u003Cp\u003EIf you provide EMOTIV with information about a third party, such as an employee, friend, or research or study partner, you promise and warrant to EMOTIV that you have obtained the informed written consent of such third party to: (i) provide this third\u002Dparty information to EMOTIV\u003B and (ii) allow EMOTIV to process and share this third\u002Dparty information in the same manner as your information under this Privacy Policy and applicable law.\u003C/p\u003E\u000A\u003Ch2\u003EHow do we use Personal Information we collect about you?\u003C/h2\u003E\u000A\u003Cp\u003EWe use Personal Information, Sensitive Personal Information, and Neural Data to:\u003C/p\u003E\u000A\u003Cp\u003E(i) provide, administer, and improve the Services\u003B\u003Cbr /\u003E\u000A (ii) better understand your needs and interests\u003B\u003Cbr /\u003E\u000A (iii) fulfill requests you make\u003B\u003Cbr /\u003E\u000A (iv) personalize your experience, such as to provide you with information regarding your overall cognitive performance relative to other users of similar age or other characteristics\u003B\u003Cbr /\u003E\u000A (v) conduct Experiments you have decided to participate in\u003B\u003Cbr /\u003E\u000A (vi) provide you with announcements, information and offers from EMOTIV\u003B\u003Cbr /\u003E\u000A (vii) protect, investigate, and deter against fraudulent, harmful, unauthorized, or illegal activity\u003B \u003C/p\u003E\u000A\u003Cp\u003E(viii) comply with legal obligations\u003B and\u003Cbr /\u003E\u000A(ix) develop and refine proprietary algorithms and models, subject to strict data minimization, statutory opt\u002Dout rights, and de\u002Didentification standards.\u003Cbr /\u003E\u000A(x) subject to your explicit opt\u002Din consent, process pseudonymized Neural Data and telemetry to train, evaluate, refine, and commercialize EMOTIV\u0027s Large Brain Model (LBM) and derivative neuro\u002DAI algorithms \u003C/p\u003E\u000A\u003Cp\u003EDelivering Personalized Emotiv\u002DIQ Analytics, Data Pooling, \u0026amp\u003B Model Development: \u003Cbr /\u003E\u000AWhen you explicitly request Emotiv\u002DIQ, processing your pseudonymized Neural Data and aggregating and pooling it into our Large Brain Model (LBM) is necessary to generate and deliver your personalized cognitive metrics. Pooled data is also used to develop new features and metrics of the kinds described below. The purposes for which we process your Neural Data under Emotiv\u002DIQ are: estimating cognitive states, load and performance\u003B inferring emotional and affective states\u003B decoding brain\u002Dcomputer interface intent and mental commands\u003B detecting biometric, motion and signal artifacts\u003B calibrating population and cohort baselines\u003B validating and improving the accuracy, safety and robustness of the LBM and derivative models\u003B and developing new features and metrics of these kinds. We will provide notice before processing your Neural Data for a purpose outside these categories. Where the law of your state restricts the processing of sensitive data to what is strictly necessary to provide a product you have requested, or prohibits the sale of sensitive data, we exclude your data from LBM training\u003B this currently applies to residents of Maryland. Data pooling across consenting users enables the LBM to continuously improve its accuracy, calibrate population baselines, and power current and future features. Data is maintained securely using industry\u002Dstandard administrative, technical, and physical safeguards, including encryption in transit and at rest. You may disable Emotiv\u002DIQ at any time in Account Settings. Doing so halts future ingestion of your Neural Data into LBM training. It does not remove contributions already incorporated into a trained model, because individual contributions cannot be isolated from model weights once training is complete. Where technically feasible we will apply retraining or machine unlearning techniques at the next full training cycle. EMOTIV does not sell raw Neural Data or Personal Information. Any model parameters, weights or API outputs derived from or licensed from the LBM are aggregated or de\u002Didentified mathematical outputs. We design, test and maintain the LBM using measures intended to prevent the extraction or re\u002Didentification of individual users from its parameters or outputs, including differential privacy techniques and periodic model inversion and membership inference testing, and we contractually prohibit any recipient from attempting re\u002Didentification.\u003C/p\u003E\u000A\u003Ch2\u003ELawful basis for processing your Personal Information\u003C/h2\u003E\u000A\u003Cp\u003EWe will only process your Personal Information  if we have a lawful basis for doing so. Lawful bases for processing includes consent, contractual necessity, legitimate interests, or other legitimate processing grounds, as further described below. The bases described in (i) to (iv) below are our Article 6 lawful bases. Where we process special category data we additionally rely on the Article 9(2)(a) explicit consent described immediately below\u003B contractual necessity and legitimate interests are not conditions under Article 9(2) and do not by themselves permit us to process Neural Data.\u003C/p\u003E\u000A\u003Cp\u003ESpecial categories of data. If you are located in the European Economic Area or the United Kingdom, EEG Data, Neural Data and derived cognitive and emotional metrics are special category data under Article 9 of the GDPR. We rely on your explicit consent under Article 9(2)(a) as the condition for processing this data, including to deliver Emotiv\u002DIQ and to train and refine the Large Brain Model. You may withdraw that consent at any time in Account Settings, and withdrawal does not affect the lawfulness of processing carried out before withdrawal.\u003C/p\u003E\u000A\u003Cp\u003E(i) \u003Cstrong\u003EConsent\u003C/strong\u003E. In some cases, we process Personal Information and Sensitive Personal Information (including Neural Data) based on the consent you give to us.\u003Cbr /\u003E\u000A (ii) \u003Cstrong\u003EContractual Necessity\u003C/strong\u003E. We process Personal Information because we need to process the information to perform our contracts with you, which allows us to provide you with the Services. When we process Personal Information due to contractual necessity, failure to provide such Personal Information will result in your inability to use some or all portions of the Services that require such Personal Information.\u003C/p\u003E\u000A\u003Cp\u003E(iii) \u003Cstrong\u003ELegitimate Interest\u003C/strong\u003E. We process some categories of Personal Information when we believe doing so furthers the legitimate interest of us or third parties. Examples of these legitimate interests include:\u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003Eoperating and improving our business, products, and services\u003B  \u003C/li\u003E\u000A\u003Cli\u003Emarketing of our products and services\u003B  \u003C/li\u003E\u000A\u003Cli\u003Eproviding customer support\u003B  \u003C/li\u003E\u000A\u003Cli\u003Eprotecting from fraud or security threats\u003B  \u003C/li\u003E\u000A\u003Cli\u003Ecomplying with legal obligations\u003B and  \u003C/li\u003E\u000A\u003Cli\u003Ecompleting corporate transactions.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Cp\u003E(iv) \u003Cstrong\u003EOther Processing Grounds\u003C/strong\u003E. From time to time, we may also need to process Personal Information to comply with a legal obligation, if it is necessary to protect the vital interests of you or other data subjects, or if it is necessary for a task carried out in the public interest.\u003C/p\u003E\u000A\u003Ch2\u003EWhat steps do we take to protect your Personal Information?\u003C/h2\u003E\u000A\u003Cp\u003EInformation like your name or birthdate are considered Personal Information. EEG Data is information we collect from your brain and constitutes Sensitive Personal Information and Neural Data under applicable state privacy laws. We recognize that access to BOTH your Personal Information and your EEG Data or Experiment Data should only be available to you, the owner of the data, and to a limited number of EMOTIV staff for the exclusive purpose of maintaining security and providing the Services.\u003C/p\u003E\u000A\u003Cp\u003EWe take the following steps to protect your Personal Information:\u003C/p\u003E\u000A\u003Cp\u003E(i) \u003Cstrong\u003EPassword Protected User Account\u003C/strong\u003E. In order to use our Services and to access your EEG Data and Experiment Data, you must create and log in to a password\u002Dprotected User Account. Your User Account contains your User Name (“EmotivID”), email address, license information and other relevant Personal Information relating to your personal use of the Services. Apart from financial transactions, correspondence and delivery records, none of your Personal Information is stored in any other location.\u003Cbr /\u003E\u000A (ii) \u003Cstrong\u003ESecurity\u003C/strong\u003E. Personal Information we collect about you is stored only in your User Account, managed through limited access servers located in the United States and other countries where EMOTIV has facilities. We use commercially reasonable security measures to protect against the loss, misuse, and alteration of your information under our control based on the type of Personal Information and applicable processing activity, such as pseudonymization, aggregation, data encryption in transit, and data encryption at rest using commercially reasonable, industry\u002Dstandard encryption protocols.\u003Cbr /\u003E\u000A (iii) \u003Cstrong\u003EPseudonymization\u003C/strong\u003E. When you create a User Account, we also create an anonymous, unique identification number (“OwnerID”) which is associated with your EEG Data and Experiment Data. Your User Account is the only place where both your Personal Information (associated with your EmotivID) and your EEG Data and Experiment Data (associated with your OwnerID) are linked, so that you can log into your account and access your own personal data. Unless you are logged in to your User Account, it is not possible to discover or deduce your personal identity from information stored or accessed when reading your EEG Data and Experiment Data.\u003Cbr /\u003E\u000A (iv) \u003Cstrong\u003EYour Responsibility\u003C/strong\u003E. By accepting the EMOTIV End User License Agreement, you agree not to add any Personal Information to your EEG Data or Experiment Data.\u003Cbr /\u003E\u000A (v) \u003Cstrong\u003EData Sharing: EMOTIV Applications\u003C/strong\u003E. EMOTIV collects EEG Data when any application based on the EMOTIV platform is used by anyone who is logged in to an EMOTIV User Account. Your pseudonymized EEG Data collected during the use of any EMOTIV\u002Denabled application is available to EMOTIV for the purpose of providing the Services. We use it for scientific and historical research purposes, and to improve the Services beyond what is necessary to provide them to you, only where you have separately opted in. Unless your Personal Information is explicitly required when using your EEG Data in order to provide you with the Services, pseudonymized data will be used and your Personal Information will not be accessed. Some EMOTIV applications allow you to opt out of data sharing. Your data sharing choices and opt\u002Dout rights shall be respected without penalty or asymmetrical choice architecture. If you opt out of data sharing, the Services we offer will be restricted only to the extent technically necessary.\u003Cbr /\u003E\u000A (vi) \u003Cstrong\u003EData Sharing: Third Party Applications\u003C/strong\u003E. Some third party applications which utilize the Services may wish to collect EEG Data. Where such data is to be shared with the third party, the application must ask for your explicit consent to allow access to that pseudonymized EEG Data specifically related to the use of the application. With your explicit consent the third party will be provided with a de\u002Didentified copy of the EEG Data collected only during your use of the application. You can withdraw permission at any time by deleting the application or by contacting EMOTIV.\u003Cbr /\u003E\u000A (vii) \u003Cstrong\u003EData Sharing: Experiment Data \u002D EMOTIV Online Games\u003C/strong\u003E. Games are provided exclusively by EMOTIV on our online platform. Your Experiment Data collected when playing Games is available to EMOTIV for the purpose of providing the Services. We use it for scientific and historical research purposes only where you have separately opted in.\u003Cbr /\u003E\u000A (viii) \u003Cstrong\u003EData Sharing: Experiment Data \u002D EMOTIV and Third Party Experiments\u003C/strong\u003E. EMOTIV offers services which allow EMOTIV and third parties to design and deploy browser\u002Dbased Experiments for remote and local participants. Participation is voluntary, and in many cases EMOTIV or the third party researcher may offer payment for your participation. You must be logged in to a valid User Account to participate in Experiments. Your Personal Information may be used by EMOTIV for valid reasons such as to effect payments for participation, but otherwise will not be used by EMOTIV, and will not be provided to the third party. You will be informed of the purpose of the Experiment and the intended use of your data, and you must explicitly consent to sharing your data each time you participate in an Experiment. With your explicit consent, the third party will be provided with a de\u002Didentified copy of the EEG Data collected only during the course of the Experiment.\u003Cbr /\u003E\u000A (ix) \u003Cstrong\u003EAccess to your Personal Information\u003C/strong\u003E. Your password\u002Dprotected User Account contains all of the Personal Information that we store on your behalf, other than commercial and logistic information related to purchase transactions, correspondence and deliveries. Many of the available fields can be accessed and edited through the application used to log into your account or through EMOTIV applications which may also record your usage history. You can contact EMOTIV at \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E for a full list of the Personal Information that we hold on your behalf, and ask us to edit or delete any or all of it.\u003Cbr /\u003E\u000A (x) \u003Cstrong\u003EWithdrawal of Consent and Deletion of Personal Information\u003C/strong\u003E. You may contact us at \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E if you wish to withdraw permission for data sharing or to delete your Personal Information in its entirety by deleting your User Account. Your User Account contains all of the Personal Information that we store on your behalf, other than commercial transactions, correspondence and deliveries. Your User Account contains the only link between your identity (your Personal Information, linked to your EmotivID) and your OwnerID, an anonymous number associated with your EEG Data and Experiment Data. If you choose to delete your User Account, all of your Personal Information will be removed and the link between your identity and the pseudonymized EEG Data and Experiment Data collected from you will be destroyed, and we will no longer be able to provide Services based on associating that data with you. Deletion of your User Account is final and we will not be able to restore access to your previous EEG Data and Experiment Data.\u003Cbr /\u003E\u000A (xi) \u003Cstrong\u003EAggregation\u003C/strong\u003E. We may aggregate your EEG Data, Neural Data and Experiment Data with the EEG Data, Neural Data and Experiment Data of others.  \u003Cbr /\u003E\u000A (xii) \u003Cstrong\u003EPCI\u002DCompliant Service Providers\u003C/strong\u003E. If the Services require you to provide any Financial Account Information, such as when you purchase subscriptions to the Services, that information will be collected and processed by third\u002Dparty PCI\u002Dcompliant service providers. EMOTIV will not retain or store any sensitive financial information such as credit card numbers other than at arm’s length through those service providers.\u003C/p\u003E\u000A\u003Cp\u003EEMOTIV employs administrative, technical, and physical safeguards to protect your personal information, neural telemetry, and consumer health data. . Where EMOTIV processes Consumer Health Data or non\u002DHIPAA health metrics of Washington or Nevada residents (including cognitive telemetry and derived health inferences), such processing is conducted in accordance with our \u003Cstrong\u003EConsumer Health Data Privacy Policy\u003C/strong\u003E, which is set out in the Consumer Health Data Disclosures section below.\u003C/p\u003E\u000A\u003Cp\u003EAlthough EMOTIV uses administrative, technical, and physical safeguards to protect your Personal Information, no security measures are 100% effective and we cannot guarantee the security of your Personal Information. We will notify you of any data breach where your Personal Information has been obtained by unauthorized third parties, as required by law.\u003C/p\u003E\u000A\u003Ch2\u003EHow and with whom we share information\u003C/h2\u003E\u000A\u003Cp\u003EWe share Personal Information with vendors, third\u002Dparty service providers, and agents who work on our behalf to help us provide the Services. These include: (i) third parties who act for us or provide services for us, such as billing and credit card payment processing, maintenance, sales, marketing, administration, support, data enrichment, hosting, and database management services\u003B and (ii) outside professional advisors (such as lawyers and accountants) for purposes related to the operation of our business such as auditing, compliance, and corporate governance. All service providers process personal data pursuant to written Data Processing Addenda (DPAs) prohibiting secondary data usage.\u003C/p\u003E\u000A\u003Cp\u003EWe also share Personal Information when we believe it is necessary to: (i) comply with applicable law or respond to valid legal process, including from law enforcement or other government agencies\u003B (ii) protect us, our business or our users, or third parties, for example to enforce our terms of use, prevent spam or other unwanted communications and investigate or protect against fraud\u003B or (iii) maintain the security of our products and services.\u003C/p\u003E\u000A\u003Cp\u003EWe may share pseudonymized EEG Data and pseudonymized Experiment Data with third parties, with your explicit, case by case consent, in connection with your voluntary participation in an Experiment. We may also share aggregated EEG Data and aggregated Experiment Data with third parties for scientific and historical research purposes and to improve the Services. EMOTIV may license trained Large Brain Model (LBM) parameters, weights, or API outputs to commercial, enterprise, and research partners . EMOTIV does not sell raw Neural Data or Personal Information to third parties.\u003C/p\u003E\u000A\u003Cp\u003EIf EMOTIV is involved in a merger, consolidation, acquisition, reorganization, sale of assets or other corporate transaction, EMOTIV may transfer your Personal Information as part of that transaction. Any acquirer or successor of EMOTIV or its assets may continue to use your Personal Information only as allowed in this Privacy Policy. You may be notified via email and/or a prominent notice on the Services of any change in ownership or resulting change in uses of your Personal Information, as well as any choices you may have regarding your Personal Information.\u003C/p\u003E\u000A\u003Cp\u003EWe will not share your Personal Information with third parties without ensuring appropriate safeguards including 2021 EU Standard Contractual Clauses and the UK Transfer Addendum) and effective and enforceable rights and remedies are in place, as required by law.\u003C/p\u003E\u000A\u003Ch2\u003EData retention\u003C/h2\u003E\u000A\u003Cp\u003EWe retain each category of Personal Information for as long as necessary for the purposes for which it was collected. We determine that period by reference to: (i) how long we need the information to provide the Services to you and to maintain your account\u003B (ii) whether the information is required to meet a legal, tax, accounting or regulatory obligation\u003B (iii) whether the information is needed to establish, exercise or defend legal claims or to resolve a dispute\u003B (iv) whether continued retention is necessary to protect the security and integrity of the Services and to prevent fraud or misuse\u003B and (v) the sensitivity of the information and the risk to you from continued retention, which we weigh more heavily for Neural Data, Sensitive Personal Information and Consumer Health Data. In general, information linked to your account is retained while your account remains open and is deleted or de\u002Didentified after closure once the purposes above no longer apply. Financial and transaction records are retained for the period required by applicable tax and accounting law. We retain Personal Information about you for as long as you have an open account with us or as otherwise necessary to provide you with the Services, and thereafter as set forth in any applicable agreement with you, or as set forth below. In some cases, we retain Personal Information for longer, if doing so is necessary to comply with our legal obligations, resolve disputes or collect fees owed, or is otherwise permitted or required by applicable law, rule, or regulation. Neural Data and EEG Data constitute Sensitive Personal Information when linked or reasonably linkable to your User Account or personal identity. Upon account deletion or consent withdrawal, EMOTIV destroys the link between your personal identity (EmotivID) and your raw telemetry (OwnerID). EMOTIV retains neural datasets post\u002Ddeletion solely where such data has been \u003Cstrong\u003Egenuinely de\u002Didentified or aggregated\u003C/strong\u003E in compliance with statutory de\u002Didentification standards (including CCPA § 1798.140(m) and GDPR Recital 26) such that the data can no longer be linked or re\u002Dassociated with an identifiable individual. Fully de\u002Didentified and aggregated model parameters or weights do not constitute personal data under Applicable Data Protection Laws.\u003C/p\u003E\u000A\u003Ch2\u003EThird\u002Dparty services\u003C/h2\u003E\u000A\u003Cp\u003EThis Privacy Policy applies only to EMOTIV  Services. It does not apply to products, services, or sites that are provided by or operated by third parties, even if such products, services or sites are linked or redirected to or from EMOTIV Services (“\u003Cstrong\u003EThird\u002DParty Services\u003C/strong\u003E”), regardless of whether or not such link or redirection is authorized by EMOTIV. Third\u002DParty Services may have their own policies regarding privacy, or no policy at all. The fact that we link to a third party site is not an endorsement, authorization, or representation that we are affiliated with that third party. EMOTIV is not responsible for Third\u002DParty Services, and you use them at your own risk. We encourage you to read the privacy policies and terms of the Third\u002DParty Services that you visit or use.\u003C/p\u003E\u000A\u003Ch2\u003EHow can you control the information we collect about you?\u003C/h2\u003E\u000A\u003Cp\u003EYou have certain rights with respect to your Personal Information, and we want to help you review and update your information to ensure it is accurate and up to date.\u003C/p\u003E\u000A\u003Cp\u003ESubject to certain limitations as set forth below or otherwise provided by law, you may email us at \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E for any of the following:\u003C/p\u003E\u000A\u003Cp\u003E(i) \u003Cstrong\u003EAccess/Right to Know\u003C/strong\u003E. You can request more information about the Personal Information and Sensitive Personal Information we hold about you and request a copy of such Personal Information .\u003Cbr /\u003E\u000A (ii) \u003Cstrong\u003ECorrection\u003C/strong\u003E. If you believe that any Personal Information we are holding about you is incorrect or incomplete, you can request that we correct or supplement such data.\u003Cbr /\u003E\u000A (iii) \u003Cstrong\u003ERemoval/Deletion\u003C/strong\u003E.  Upon receipt of a valid, authenticated Data Subject Request, EMOTIV shall securely delete Personal Information and Neural Data in its possession or control, except to the extent: (a) retention is required by applicable statutory, tax, or regulatory obligations\u003B (b) data resides on isolated security backup systems (which shall be overwritten in the ordinary course of backup rotation)\u003B or (c) data has been genuinely de\u002Didentified or aggregated in compliance with statutory de\u002Didentification standards such that it no longer constitutes Personal Data \u003Cbr /\u003E\u000A (iv) \u003Cstrong\u003EPortability\u003C/strong\u003E. You can ask for a copy of your Personal Information in a machine\u002Dreadable format. You can also request that we transmit the Personal Information to another controller where technically feasible.\u003Cbr /\u003E\u000A (v) \u003Cstrong\u003EWithdrawal of Consent\u003C/strong\u003E. If we are processing your Personal Information or Sensitive Personal Information based on your consent, you have the right to withdraw your consent at any time. Please note, however, that if you exercise this right, you may thereafter have to      provide express consent on a case\u002Dby\u002Dcase basis for the use or disclosure of certain of your Personal Information, if such use or disclosure is necessary to enable you to utilize some or all of the Services. Any use of your Personal Information that has already been performed prior to our receipt of your request will not be reversed, undone, or withdrawn. If you withdraw your consent, EMOTIV will cease processing your Personal Information and Sensitive Personal Information (including pseudonymized Neural Data) for the specific processing activities relying on that consent. EMOTIV may continue to retain and use data solely to the extent it has been genuinely de\u002Didentified or aggregated in compliance with statutory de\u002Didentification standards (such that it can no longer be linked or re\u002Dassociated with you), or where retention is permitted under Applicable Data Protection Laws.\u003Cbr /\u003E\u000A (vi) \u003Cstrong\u003EObjection\u003C/strong\u003E. You can contact us to let us know that you object to the further use or disclosure of your Personal Information for certain purposes, such as for marketing purposes, targeted advertising, or cross\u002Dcontext behavioral advertising.\u003C/p\u003E\u000A\u003Cp\u003E(vii) \u003Cstrong\u003ERestriction of Processing\u003C/strong\u003E. You can ask us to restrict further processing of your Personal Information or limit our use of Sensitive Personal Information (including Neural Data) to essential operational purposes.\u003Cbr /\u003E\u000A(viii) \u003Cstrong\u003ERight to Appeal.\u003C/strong\u003E  If we decline to act on your privacy request, you may submit an appeal by contacting privacy@emotiv.com. We will respond to an appeal within forty\u002Dfive (45) days. If your appeal is denied, you may contact your state Attorney General to submit a complaint\u003C/p\u003E\u000A\u003Cp\u003EWe will give you the ability to opt\u002Dout of marketing\u002Drelated emails by contacting us at \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E, or clicking on a link at the bottom of each such email. You cannot opt\u002Dout of receiving certain non\u002Dmarketing emails regarding the Services.\u003C/p\u003E\u000A\u003Cp\u003EIf you want to disable cookies, check with your browser provider to learn how. EMOTIV automatically recognizes and honors Global Privacy Control (GPC) and Universal Opt\u002DOut Preference Signals broadcast from your browser.\u003C/p\u003E\u000A\u003Cp\u003EExcept as permitted by your consent to this Privacy Policy, you will be notified when your Personal Information may be shared with third parties, and you may be able to prevent the sharing of this information. To the extent permitted or required by applicable law, you can opt\u002Dout of having your information shared with a third party that is not our agent, by contacting us at \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E. However, please note that opting\u002Dout of information sharing or collection may affect your ability to use some or all features of the Services.\u003C/p\u003E\u000A\u003Cp\u003EOnce EMOTIV provides pseudonymized Experiment Data to a third\u002Dparty conducting an Experiment in which you have volunteered to participate , EMOTIV will be unable to delete such data from the third party’s possession.\u003C/p\u003E\u000A\u003Cp\u003EWe may limit or reject your request in certain cases, such as  if it is frivolous or extremely impractical, if it jeopardizes our rights or the rights of others, if it is not required by law, or if the burden or expense of providing access would be disproportionate to the risks to your privacy in the case in question. In some cases, we may also need you to provide us with additional information, which may include Personal Information, to verify your identity and the nature of your request. We will take reasonable steps to respond to all requests within 45 days (or 30 days where required by law).\u003C/p\u003E\u000A\u003Cp\u003EYou also have the right to lodge a complaint about EMOTIV’s practices with respect to your Personal Information with the supervisory authority of your country or EU Member State.\u003C/p\u003E\u000A\u003Ch2\u003ESocial media features\u003C/h2\u003E\u000A\u003Cp\u003ESome parts of the Services may include social media features. These social media features are either hosted by a third party or hosted directly on the Services. When you use these tools, the party that provides the tool, the third party that operates the social media services, and/or we may receive Personal Information about you. By using these tools, you acknowledge that some information, including Personal Information, will be transmitted to us, and that information is therefore covered by this Privacy Policy, and that some information, including Personal Information, may be shared with the third\u002Dparty services, and that information is therefore governed by their privacy policies.\u003C/p\u003E\u000A\u003Cp\u003EIn general, Personal Information, once shared or disclosed, can be difficult to contain or retrieve. EMOTIV will have no responsibility or liability for any consequences that may result because you have released or shared Personal Information with others.\u003C/p\u003E\u000A\u003Ch2\u003EClosing your account\u003C/h2\u003E\u000A\u003Cp\u003EYou may close an account, and upon termination of your user account, we will take reasonable steps to provide, modify, or delete your Personal Information as soon as is practicable. However, EMOTIV may nevertheless retain your Personal Information to protect the business interests of EMOTIV, and some information may remain in archived/backup copies for our records or as otherwise required by law. Those interests include without limitation the completion of transactions, maintaining records for financial reporting purposes, complying with our legal obligations, resolving disputes, and enforcing agreements. We may retain your pseudonymized and/or aggregated EEG Data and pseudonymized or aggregated Experiment Data, which has been processed so that it can no longer reasonably be linked to you and no longer constitutes Personal Information , for scientific or historical research purposes and to improve the Services. Pseudonymized data remains Personal Information and is retained and deleted in accordance with the retention and deletion sections above.\u003C/p\u003E\u000A\u003Ch2\u003ECalifornia and Multi\u002DState privacy rights\u003C/h2\u003E\u000A\u003Cp\u003EUnder the California Consumer Privacy Act (CCPA/CPRA) and state privacy laws, residents have the right to: (1) Know and access personal information collected, sold, or shared\u003B (2) Request deletion of personal information and Neural Data\u003B (3) Request correction of inaccurate personal data\u003B (4) Opt\u002Dout of the sale or sharing of personal data for cross\u002Dcontext behavioral advertising\u003B (5) Limit the use and disclosure of Sensitive Personal Information (including Neural Data)\u003B (6) Opt\u002Dout of profiling and automated decision\u002Dmaking technology\u003B and (7) Receive non\u002Ddiscriminatory treatment for exercising privacy rights. \u003C/p\u003E\u000A\u003Cp\u003ETo exercise state privacy rights, submit a request via email at privacy@emotiv.com or through the “Limit the Use of My Sensitive Personal Information” and “Your Privacy Choices” links in the footer of our website and in Account Settings. The “Limit the Use of My Sensitive Personal Information” control lets you restrict our use of Neural Data and other Sensitive Personal Information to the purposes necessary to provide the Services. Notice at collection of the categories of Sensitive Personal Information we collect, the purposes for each, and the retention period for each is provided in the sections above. We honor Global Privacy Control (GPC) signals sent from your browser.\u003C/p\u003E\u000A\u003Ch2\u003EConsumer Health Data Disclosures \u003Cem\u003E(Washington, Nevada \u0026amp\u003B State Health Privacy Laws)\u003C/em\u003E\u003C/h2\u003E\u000A\u003Cp\u003EThis section applies solely to non\u002DHIPAA health, cognitive wellness, and neural metrics collected from residents of jurisdictions with specific consumer health privacy statutes (including Washington and Nevada). \u003Cbr /\u003E\u000A1. Categories of Consumer Health Data Collected:\u003C/p\u003E\u000A\u003Cul\u003E\u000A\u003Cli\u003ERaw electrical biosignals, central or peripheral nervous system telemetry, and EEG data.  \u003C/li\u003E\u000A\u003Cli\u003EDerived cognitive performance metrics (e.g., Focus, Attention, Stress, Cognitive Load, Fatigue, Readiness, and Brain Age).  \u003C/li\u003E\u000A\u003Cli\u003EFacial expression artifacts and eye movement telemetry.  \u003C/li\u003E\u000A\u003Cli\u003EVoluntary health\u002Drelated survey responses provided during research experiments.\u003C/li\u003E\u000A\u003C/ul\u003E\u000A\u003Cp\u003E2. Sources of Consumer Health Data: We collect Consumer Health Data directly from you when you connect an EMOTIV headset, interact with our Software or Applications, or participate in Experiments.\u003Cbr /\u003E\u000A3. Purpose of Collection and Processing: We collect and process Consumer Health Data to: (i) operate your neuroheadset and software\u003B (ii) deliver personalized cognitive metrics and requested features (such as Emotiv\u002DIQ™)\u003B (iii) improve our Services and algorithms\u003B and (iv) subject to your explicit opt\u002Din consent, aggregate and pool pseudonymized telemetry to train our Large Brain Model (LBM).\u003Cbr /\u003E\u000A4. Sharing of Consumer Health Data: EMOTIV does not sell raw Consumer Health Data or Neural Data to third parties. We share Consumer Health Data only: (i) with third\u002Dparty service providers bound by Data Processing Addenda solely to support app infrastructure\u003B (ii) with third\u002Dparty researchers or applications where you explicitly authorize us to transfer your data\u003B or (iii) as necessary to comply with legal obligations.\u003Cbr /\u003E\u000A5. Your Rights \u0026amp\u003B Appeal Process: You have the right to confirm collection, access, correct, or request deletion of your Consumer Health Data, or withdraw consent for health data processing. You may exercise these rights by contacting privacy@emotiv.com. If we decline to take action on your request, you may appeal our decision by emailing privacy@emotiv.com with the subject line \u0022Consumer Health Privacy Appeal\u0022.\u003C/p\u003E\u000A\u003Ch2\u003EEU AI Act \u0026amp\u003B Biometric Transparency Disclosures\u003C/h2\u003E\u000A\u003Cp\u003EIn accordance with Article 5 and Article 50 of the EU AI Act: (i) EMOTIV contractually prohibits users, employers, and educational institutions from deploying our Hardware or Software to infer emotions or mental states of workers or students in workplace or academic settings\u003B and (ii) where EMOTIV software utilizes biometric categorization or emotion recognition outside prohibited contexts, users are provided with real\u002Dtime transparency notice informing them that an AI system is actively processing biosignals or cognitive metrics.\u003C/p\u003E\u000A\u003Ch2\u003EChanges to this Privacy Policy\u003C/h2\u003E\u000A\u003Cp\u003EWe reserve the right to modify this Privacy Policy at any time. We encourage you to periodically review this page for the latest information on our privacy practices. If we make material changes to this Privacy Policy, you will be notified via email (if you have an account where we have your contact information) or otherwise in some manner through the Services that we deem reasonably likely to reach you (which may include posting a new privacy policy on our websites). Any modifications to this Privacy Policy will be effective upon our posting of the new terms and/or upon implementation of the new changes on the Services (or as otherwise indicated at the time of posting) or on the Effective Date set forth in the modified Privacy Policy. In all cases, your continued use of the Services after the posting of any modified Privacy Policy indicates your agreement to the processing of your Personal Information under the terms of the modified Privacy Policy.\u003C/p\u003E\u000A\u003Ch2\u003EChildren and Minors\u003C/h2\u003E\u000A\u003Cp\u003EThe Services are not intended for children or minors under the age of 18, and therefore, EMOTIV does not knowingly acquire or receive Personal Information from children under the age of 18. If we later learn that any user of the Services is under the age of 18, we will take appropriate steps to remove that user’s information from our account database and will restrict that individual from future access to the Services. Please contact \u003Ca href\u003D\u0022mailto:hello@emotiv.com\u0022\u003Ehello@emotiv.com\u003C/a\u003E if you are a parent or guardian of a child or minor under 18 whom you believe has provided us with any Personal Information.\u003C/p\u003E\u000A\u003Ch2\u003EEnforcement and acceptance of this Privacy Policy\u003C/h2\u003E\u000A\u003Cp\u003EWe will conduct internal audits of our compliance with this Privacy Policy, and work to ensure that our employees and service providers also adhere to the Privacy Policy.\u003C/p\u003E\u000A\u003Cp\u003EIf you have any questions or concerns regarding privacy related to the Services, please contact us by mail, telephone, or email using the contact information set forth below, and we will try to resolve your concerns.\u003C/p\u003E\u000A\u003Cp\u003EEmail: \u003Ca href\u003D\u0022mailto:privacy@emotiv.com\u0022\u003Eprivacy@emotiv.com\u003C/a\u003E\u003C/p\u003E\u000A\u003Cp\u003ETelephone +1:(415) 801\u002D0400\u003C/p\u003E\u000A\u003Cp\u003EAddress: EMOTIV, Inc., Attn: Nikunj Mehta, Data Protection Officer, 490 Post Street, Suite 824, San Francisco, CA 94102, USA\u003C/p\u003E\u000A\u003Cp\u003EBy (i) clicking “I accept EMOTIV’s Privacy Policy” or its equivalent, or (ii) using or accessing the Services on or after the effective date in any way, except for the sole purpose of reviewing this Privacy Policy, you are agreeing to the processing of your Personal Information and non\u002Dpersonal information under the terms of this Privacy Policy.\u003C/p\u003E"
